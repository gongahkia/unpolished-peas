<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>72</title>
    <style>
      body { background: #0f1218; color: #dce0e5; font: 16px monospace; margin: 2rem; }
      canvas { border: 1px solid #505a6c; image-rendering: pixelated; max-width: 100%; }
    </style>
  </head>
  <body>
    <h1>72</h1>
    <p>Click the canvas. A/D moves, W/Space jumps, S crouches or with jump drops/slams, Shift rolls, E interacts, J throws, F toggles tether, and arrows aim.</p>
    <script src="wasm_exec.js"></script>
    <script>
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("72.wasm"), go.importObject)
        .then(({ instance }) => go.run(instance))
        .catch((error) => document.body.append(`WASM startup failed: ${error}`));
    </script>
  </body>
</html>
