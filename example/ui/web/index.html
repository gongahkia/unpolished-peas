<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>72 retained UI sample</title>
    <link rel="icon" href="data:,">
    <style>
      body { background: #0c101a; color: #ebf2ff; font: 16px system-ui, sans-serif; margin: 2rem; }
      canvas { border: 1px solid #657ca5; image-rendering: pixelated; max-width: 100%; }
    </style>
  </head>
  <body>
    <h1>72 retained UI sample</h1>
    <p>Use down/tab and up to move focus, enter/space to select, or click a button.</p>
    <script src="wasm_exec.js"></script>
    <script>
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("ui-sample.wasm"), go.importObject)
        .then(({ instance }) => go.run(instance))
        .catch((error) => document.body.append(`WASM startup failed: ${error}`));
    </script>
  </body>
</html>
