<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>72 first game</title>
    <style>
      body { background: #121b2e; color: #ebf2ff; font: 16px system-ui, sans-serif; margin: 2rem; }
      canvas { border: 1px solid #5ee6a0; image-rendering: pixelated; max-width: 100%; }
    </style>
  </head>
  <body>
    <h1>72 first game</h1>
    <p>Use A/D or the arrow keys to move. Press space to jump.</p>
    <script src="wasm_exec.js"></script>
    <script>
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("first-game.wasm"), go.importObject)
        .then(({ instance }) => go.run(instance))
        .catch((error) => document.body.append(`WASM startup failed: ${error}`));
    </script>
  </body>
</html>
