name: go-next

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  compatibility:
    name: Go 1.26 compatibility
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: go vet ./...
      - run: go test ./...
