name: MOD-01 CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full repository check
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Enable pinned pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Set up and build
        run: make setup

      - name: Install browser libraries
        run: pnpm exec playwright install-deps firefox chromium

      - name: Run the full quality gate
        run: make check
