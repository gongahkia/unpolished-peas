name: reviewed release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed, annotated v0.x.y tag approved for this release build
        required: true
        type: string
      attest:
        description: Create provenance and SBOM attestations when repository eligibility is confirmed
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-tag:
    name: validate reviewed tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: require a GitHub-verified signed v0 tag at HEAD
        env:
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v0\.[0-9]+\.[0-9]+$'
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          git tag --points-at HEAD | grep -Fx "$TAG"
          tag_object=$(git rev-parse "refs/tags/$TAG")
          verification=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/tags/$tag_object" | jq -r '.verification.verified')
          test "$verification" = true

  build-wasm-demos:
    name: build wasm demo bundle
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
      - name: build checked demo bundle and checksum
        env:
          TAG: ${{ inputs.tag }}
        run: ./scripts/build-release-wasm.sh "$TAG"
      - name: generate SPDX SBOM without publishing it
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: release-artifacts/72-wasm-demos-${{ inputs.tag }}.tar.gz
          format: spdx-json
          output-file: release-artifacts/72-wasm-demos-${{ inputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: checksum all release artifacts
        run: sha256sum release-artifacts/* > release-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 72-wasm-demos-${{ inputs.tag }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  attest:
    name: attest eligible artifacts
    needs: build-wasm-demos
    if: ${{ inputs.attest && (!github.event.repository.private || vars.ATTESTATIONS_ELIGIBLE == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 72-wasm-demos-${{ inputs.tag }}
          path: release-artifacts
      - name: attest wasm demo build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/72-wasm-demos-${{ inputs.tag }}.tar.gz
      - name: attest wasm demo SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/72-wasm-demos-${{ inputs.tag }}.tar.gz
          sbom-path: release-artifacts/72-wasm-demos-${{ inputs.tag }}.spdx.json
