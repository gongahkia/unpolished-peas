name: release-signing

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install Zig 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz' | sha256sum --check --status
          tar --extract --file zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Validate release tag
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < contracts/v1_release_contracts.version)"
      - name: Gate released API compatibility
        run: zig build public-api-regression && zig build compatibility-contract && zig build c-header-contract
      - name: Gate fuzz and lifecycle coverage
        run: zig build test
      - name: Gate deterministic NAT matrix
        run: zig build reference-test
      - name: Gate STUN TURN integration
        run: zig build stun-turn-interop
      - name: Gate 1,000-peer benchmark regressions
        run: zig build benchmark-regression
  sign:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install Zig 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz' | sha256sum --check --status
          tar --extract --file zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
        with:
          cosign-release: 'v3.0.6'
      - name: Validate release tag
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < contracts/v1_release_contracts.version)"
      - name: Generate release artifact checksums
        run: zig build release-checksums
      - name: Verify release provenance
        run: sh script/check_release_provenance.sh
      - name: Attest release build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: 'zig-out/minna-san-release-*/**'
      - name: Attest release compiler and target provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: 'zig-out/minna-san-release-*/**'
          predicate-type: https://minna-san.dev/attestation/release-provenance/v1
          predicate-path: 'zig-out/minna-san-release-*/provenance.json'
      - name: Sign release artifacts
        run: sh script/sign_release_artifacts.sh
      - name: Verify release signatures
        env:
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-signing.yml@${{ github.ref }}
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: sh script/check_release_signatures.sh
      - name: Archive signed release artifacts
        run: sh script/package_release_archive.sh
      - name: Sign release archive
        run: sh script/sign_release_archive.sh
      - name: Verify release archive signature
        env:
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-signing.yml@${{ github.ref }}
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: sh script/check_release_archive_signature.sh
      - name: Attest signed release archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: 'zig-out/minna-san-release-*.tar.gz'
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minna-san-release-${{ github.ref_name }}
          path: zig-out/minna-san-release-*
  publish:
    needs: [gate, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: minna-san-release-${{ github.ref_name }}
          path: release
      - name: Locate signed release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find release -type f -name "minna-san-release-${GITHUB_REF_NAME#v}.tar.gz" -print)"
          test -f "$archive" && test -f "$archive.sigstore.json"
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sigstore.json#minna-san-release-${GITHUB_REF_NAME#v}.tar.gz.sigstore.json" --generate-notes --title "minna-san ${GITHUB_REF_NAME#v}" --verify-tag
