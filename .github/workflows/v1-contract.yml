name: v1-contract

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: v1-contract-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark-harness:
    name: Reproducible benchmark harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Cache immutable Zig build inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**', 'contracts/**', 'script/**') }}
      - name: Install Zig 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz' | sha256sum --check --status
          tar --extract --file zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Test result schema and bounds
        run: zig build benchmark-harness-test
      - name: Emit deterministic 1,000-peer baseline
        run: zig build benchmark-harness -- --seed 1 --peers 1000 --groups 10 --steps 64 --payload-bytes 128 --clock-step-ns 1000000
      - name: Benchmark authoritative 1,000-peer sessions
        run: zig build benchmark-authoritative -Doptimize=ReleaseFast
      - name: Benchmark sharded P2P 1,000-peer sessions
        run: zig build benchmark-sharded-p2p -Doptimize=ReleaseFast
      - name: Benchmark topology faults
        run: zig build benchmark-topology-faults -Doptimize=ReleaseFast
      - name: Benchmark throughput and backpressure
        run: zig build benchmark-throughput -Doptimize=ReleaseFast
      - name: Benchmark memory and resource ceilings
        run: zig build benchmark-memory -Doptimize=ReleaseFast
      - name: Enforce benchmark regression thresholds
        run: zig build benchmark-regression
  api-compatibility:
    name: Released public API compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Cache immutable Zig build inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**', 'contracts/**', 'script/**') }}
      - name: Install Zig 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz' | sha256sum --check --status
          tar --extract --file zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Compare released Zig and C contracts
        run: zig build public-api-regression
      - name: Compile public compatibility contracts
        run: zig build compatibility-contract && zig build c-header-contract
  zig-compatibility:
    name: Zig ${{ matrix.channel }} compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        channel: [pinned, rolling]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Cache immutable Zig build inputs
        if: matrix.channel == 'pinned'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**', 'contracts/**', 'script/**') }}
      - name: Install pinned Zig 0.15.2
        if: matrix.channel == 'pinned'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz' | sha256sum --check --status
          tar --extract --file zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Install rolling Zig
        if: matrix.channel == 'rolling'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output zig-index.json https://ziglang.org/download/index.json
          python3 - <<'PY' > zig-rolling.env
          import json
          import re

          with open("zig-index.json", encoding="utf-8") as source:
              master = json.load(source)["master"]
          version = master["version"]
          entry = master["x86_64-linux"]
          url = entry["tarball"]
          checksum = entry["shasum"]
          if not re.fullmatch(r"[A-Za-z0-9.+-]+", version):
              raise SystemExit("invalid rolling Zig version")
          if url != f"https://ziglang.org/builds/zig-x86_64-linux-{version}.tar.xz":
              raise SystemExit("invalid rolling Zig URL")
          if not re.fullmatch(r"[0-9a-f]{64}", checksum):
              raise SystemExit("invalid rolling Zig checksum")
          print(f"ZIG_URL={url}")
          print(f"ZIG_SHA256={checksum}")
          print(f"ZIG_DIRECTORY=zig-x86_64-linux-{version}")
          PY
          . ./zig-rolling.env
          curl --fail --location --retry 3 --silent --show-error --output zig.tar.xz "$ZIG_URL"
          printf '%s  zig.tar.xz\n' "$ZIG_SHA256" | sha256sum --check --status
          tar --extract --file zig.tar.xz
          echo "$PWD/$ZIG_DIRECTORY" >> "$GITHUB_PATH"
      - name: Verify compiler channel
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test -n "$(zig version)"
          if [ "${{ matrix.channel }}" = "pinned" ]; then test "$(zig version)" = "0.15.2"; fi
      - name: Check source compatibility
        run: zig build test
      - name: Check C ABI compatibility
        run: zig build c-abi-parity
  linux-sdk:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Cache immutable Zig build inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**', 'contracts/**', 'script/**') }}
      - name: Install Zig 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz' | sha256sum --check --status
          tar --extract --file zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Verify native Zig version
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(zig version)" = "0.15.2"
      - name: Compile C ABI smoke sources
        run: |
          mkdir -p .c-abi-compiler
          gcc -std=c11 -Wall -Wextra -Werror -c -o .c-abi-compiler/c_abi_types.o -I packages/c-abi/include contracts/fixtures/c_abi_types.c
          gcc -std=c11 -Wall -Wextra -Werror -c -o .c-abi-compiler/c_abi_consumer.o -I packages/c-abi/include contracts/fixtures/c_abi_consumer.c
      - name: Build and test SDK artifacts
        run: zig build test
      - name: Build C ABI artifact and consumer
        run: zig build c-abi-parity
      - name: Build reproducible C SDK libraries
        run: zig build c-sdk-desktop-reproducible
      - name: Package versioned static C SDK libraries
        run: zig build c-sdk-static-package
      - name: Package versioned shared C SDK libraries
        run: zig build c-sdk-shared-package
  windows-sdk:
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Cache immutable Zig build inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**', 'contracts/**', 'script/**') }}
      - name: Install Zig 0.15.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip -OutFile zig.zip
          if ((Get-FileHash zig.zip -Algorithm SHA256).Hash -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') { throw 'invalid Zig archive checksum' }
          Expand-Archive -Path zig.zip -DestinationPath .
          "$PWD\zig-x86_64-windows-0.15.2" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify native Zig version
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'unexpected Windows architecture' }
          if ((zig version) -ne '0.15.2') { throw 'unexpected Zig version' }
      - name: Compile C ABI smoke sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .c-abi-compiler | Out-Null
          cl /nologo /std:c11 /W4 /WX /c /I packages\c-abi\include /Fo.c-abi-compiler\c_abi_types.obj contracts\fixtures\c_abi_types.c
          cl /nologo /std:c11 /W4 /WX /c /I packages\c-abi\include /Fo.c-abi-compiler\c_abi_consumer.obj contracts\fixtures\c_abi_consumer.c
      - name: Build and test SDK artifacts
        run: zig build test
      - name: Build C ABI artifact and consumer
        run: zig build c-abi-parity
  macos-sdk:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            zig_arch: aarch64
            sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
          - arch: x86_64
            runner: macos-15-intel
            zig_arch: x86_64
            sha256: 375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Cache immutable Zig build inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**', 'contracts/**', 'script/**') }}
      - name: Install Zig 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output zig.tar.xz https://ziglang.org/download/0.15.2/zig-${{ matrix.zig_arch }}-macos-0.15.2.tar.xz
          echo '${{ matrix.sha256 }}  zig.tar.xz' | shasum -a 256 --check --status
          tar --extract --file zig.tar.xz
          echo "$PWD/zig-${{ matrix.zig_arch }}-macos-0.15.2" >> "$GITHUB_PATH"
      - name: Verify native Zig version
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          test "$(zig version)" = "0.15.2"
      - name: Compile C ABI smoke sources
        run: |
          mkdir -p .c-abi-compiler
          clang -std=c11 -Wall -Wextra -Werror -c -o .c-abi-compiler/c_abi_types.o -I packages/c-abi/include contracts/fixtures/c_abi_types.c
          clang -std=c11 -Wall -Wextra -Werror -c -o .c-abi-compiler/c_abi_consumer.o -I packages/c-abi/include contracts/fixtures/c_abi_consumer.c
      - name: Build and test SDK artifacts
        run: zig build test
      - name: Build C ABI artifact and consumer
        run: zig build c-abi-parity
      - name: Build reproducible C SDK libraries
        run: zig build c-sdk-macos-reproducible
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Cache immutable Zig build inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**', 'contracts/**', 'script/**') }}
      - name: Install Zig 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz' | sha256sum --check --status
          tar --extract --file zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Verify Zig version
        run: test "$(zig version)" = "0.15.2"
      - name: Check module boundary
        run: zig build contract
      - name: Check workspace graph
        run: zig build workspace-graph
      - name: Check public API
        run: zig build api-contract
      - name: Check licensing
        run: zig build license-metadata
      - name: Check formatting
        run: zig build quality
      - name: Check dependency policy
        run: zig build dependency-policy
